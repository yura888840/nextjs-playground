name: Build, test, and deploy Next.js

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/task-validation, feat/postgres-task-storage, feat/account-sessions, feat/task-permissions, feat/task-search-pagination, feat/task-attachments, feat/github-integration]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to production (main branch only)
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: playground
          POSTGRES_PASSWORD: playground
          POSTGRES_DB: playground_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playground -d playground_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://playground:playground@localhost:5432/playground_test
      TEST_DATABASE_URL: postgresql://playground:playground@localhost:5432/playground_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:storage-unavailable
      - run: npm run db:migrate
      - run: npm run test:api
      - run: npm run test:db
      - run: npm run test:auth
      - run: npm run test:permissions
      - run: npm run test:search
      - run: npm run test:uploads
      - run: npm run test:integrations

  deploy:
    needs: build-and-test
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy) ||
       (github.event_name == 'push' && vars.VERCEL_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check deployment credentials
        run: |
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing repository secret: $key"
              exit 1
            fi
          done
      - name: Install Vercel CLI
        run: npm install --global vercel@59.23.1
      - name: Load production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build deployment artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production artifact
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
